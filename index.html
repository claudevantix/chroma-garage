<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Chroma Garage</title>
<style>
:root{--bg:#0d1320;--panel:#172131;--panel2:#1f2c42;--ink:#eef3fb;--mut:#93a3bd;--acc:#2ee6d6;--bad:#ff5a6e;--gold:#ffd23f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none;-moz-user-select:none;-ms-user-select:none}
#app{display:flex;flex-direction:column;height:100vh;height:100dvh;max-width:640px;margin:0 auto;padding:0 12px}
#hud{display:flex;align-items:center;gap:10px;height:54px;flex:none}
#mvbar{height:5px;border-radius:9px;background:#1d2840;overflow:hidden;flex:none;margin:0 2px 6px}#mvbar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#2ee6d6,#5fb3ff);border-radius:9px;transition:width .25s ease,background .25s}#mvbar.low i{background:linear-gradient(90deg,#ff7a59,#ff5a6e)}
#hud .lv{font-weight:800;font-size:18px;flex:1;text-align:center;letter-spacing:.2px}
#mv{font-weight:800;min-width:92px;font-size:15px}
#mv.low{color:var(--bad)}
#coins{font-weight:800;color:var(--gold);min-width:50px;text-align:right;display:flex;align-items:center;justify-content:flex-end;gap:5px}#coins.pop{animation:pop .45s ease}
.savest{background:none;border:0;color:#6fcf97;font-size:13px;padding:0 2px;min-width:16px;opacity:.55;cursor:pointer}.savest.flash{opacity:1}.savest.bad{color:#ff7a7a;opacity:1}
.restore{font-size:12px;color:#8fa3c4;text-align:center;margin:-2px 0 0}
#queue{display:flex;gap:5px;flex-wrap:wrap;justify-content:center;flex:none;padding:2px 0 6px;min-height:30px}
#queue i{font-style:normal;font-weight:800;font-size:12px;min-width:26px;height:26px;border-radius:9px;display:flex;align-items:center;justify-content:center;color:#0b1220}
#queue i.done{opacity:.25;text-decoration:line-through}
#queue i.next{outline:3px solid #fff;outline-offset:1px}
#tut{flex:none;margin:0 0 6px}
#tut .b{background:var(--panel2);border:1px solid #2f4262;border-radius:14px;padding:9px 12px;font-size:14px;line-height:1.35;display:flex;gap:10px;align-items:center}
#tut .b span{flex:1}
#board{flex:1;min-height:0;position:relative}
#app.fixh #board{min-height:min(260px,45vh)}
canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
#bar{display:flex;gap:8px;height:66px;flex:none;align-items:center;padding-bottom:max(6px,env(safe-area-inset-bottom))}
button{font:inherit;color:var(--ink);background:var(--panel2);border:1px solid #2f4262;border-radius:12px;min-height:46px;padding:0 12px;cursor:pointer;font-weight:700}
button:hover{background:#27385a}
button:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
button:disabled{opacity:.45;cursor:default}
button.pri{background:var(--acc);color:#05201d;border-color:var(--acc)}
button.ad{background:transparent;border-color:#3a4a6b;color:#b9c6dc;font-weight:600}
button.sm{min-height:38px;font-size:13px}
button{transition:transform .08s ease,background .15s}
button:active{transform:scale(.96)}
#bar button{flex:1;white-space:nowrap;font-size:11px;padding:4px 4px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;line-height:1.1;font-weight:700;color:#cfe0f7}
#bar button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
#bar button .lb{opacity:.92}
.ico{width:46px;padding:0;font-size:20px}
#ov{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(5,9,16,.78);padding:16px;overflow:auto;z-index:5}
#ov.on{display:flex}#ov.soft{background:rgba(5,9,16,.5)}
.box{overscroll-behavior:contain;background:var(--panel);border:1px solid #2a3a58;border-radius:20px;padding:20px;width:min(440px,100%);max-height:100%;overflow:auto;display:flex;flex-direction:column;gap:10px}
.box h2{margin:0;font-size:24px;text-align:center}
.howto{list-style:none;margin:4px 0;padding:0;display:flex;flex-direction:column;gap:10px}.howto li{display:flex;gap:10px;align-items:flex-start;font-size:15px;line-height:1.35;text-align:left}.howto .ic{flex:0 0 30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-weight:900;color:#10131c;font-size:15px}@media (max-height:740px){.howto{gap:6px}.howto li{font-size:13.5px;line-height:1.28}.howto .ic{flex-basis:24px;height:24px;font-size:13px}}
.logo{font-size:34px;font-weight:900;text-align:center;line-height:1.05;background:linear-gradient(90deg,#2ee6d6,#5fb3ff 40%,#ff5fa2 75%,#ffd23f);-webkit-background-clip:text;background-clip:text;color:transparent;margin:2px 0 4px}
.stars span{display:inline-block;animation:starIn .45s cubic-bezier(.2,1.6,.4,1) both}.stars span:nth-child(2){animation-delay:.15s}.stars span:nth-child(3){animation-delay:.3s}.stars .off{color:#3a4a6b}
@keyframes starIn{0%{transform:scale(0) rotate(-40deg);opacity:0}100%{transform:scale(1) rotate(0);opacity:1}}@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.25)}100%{transform:scale(1)}}
.box{animation:boxIn .22s ease both}@keyframes boxIn{0%{transform:translateY(10px) scale(.97);opacity:0}100%{transform:none;opacity:1}}
.lvgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;max-height:52vh;overflow:auto;padding:2px}
.lvgrid button{min-height:52px;padding:4px 0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:15px;border-radius:12px}
.lvgrid button small{font-size:10px;color:var(--gold);letter-spacing:1px}.lvgrid button.t1{border-color:#8a7420}.lvgrid button.t2{border-color:#8a2f3c}.lvgrid button.cur{outline:2px solid var(--acc)}
.box p{margin:0;color:var(--mut);font-size:14px;line-height:1.45;text-align:center}
.stars{font-size:38px;text-align:center;letter-spacing:6px;color:var(--gold)}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between}
table{width:100%;border-collapse:collapse;font-size:13px}td{padding:4px 2px;border-bottom:1px solid #243452}td:last-child{text-align:right;font-weight:700}
.tag{display:inline-block;background:#4a2330;color:#ffb3bf;border-radius:8px;padding:6px 10px;font-size:12px;text-align:center}
.cd{font-size:56px;font-weight:800;text-align:center;color:var(--acc)}
.fin{color:#ffd23f;font-weight:700;text-align:center}
.tag2{font-size:12px;color:#8fa3c4;margin:-4px 0 0;text-align:center}
.tap{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
.tap div{aspect-ratio:1;border-radius:6px;background:#1b273b;border:1px dashed #33476a;display:flex;align-items:center;justify-content:center;font-size:10px;color:#4f6485}
.tap div.on{border:1px solid rgba(0,0,0,.35);color:transparent}
#toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);background:var(--gold);color:#2b2200;font-weight:800;padding:8px 14px;border-radius:999px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:6}
#toast.on{opacity:1}
@media (max-height:600px){#hud{height:44px}#bar{height:56px}}
</style>

<script id="coreSrc" type="text/plain">/* Núcleo de Garage 2: deslizar autos por su eje; los autos salen EN ORDEN (cola 1,2,3…).
   Auto: {x,y,len,h(1=horizontal),ex(+1/-1 extremo de salida),c(color)}; el índice en el arreglo = turno de salida.
   Un auto sale cuando está pegado a su puerta (extremo) y es su turno. */
function axisSize(c,cols,rows){return c.h?cols:rows}
function startPos(c){return c.h?c.x:c.y}
function dockPos(c,cols,rows){return c.ex>0?axisSize(c,cols,rows)-c.len:0}
function cellsAt(c,p){const a=[];for(let i=0;i<c.len;i++)a.push(c.h?[p+i,c.y]:[c.x,p+i]);return a}
function occupy(cars,pos,cols,rows){const g=new Int8Array(cols*rows).fill(-1);for(let i=0;i<cars.length;i++){if(pos[i]===-1)continue;for(const[x,y]of cellsAt(cars[i],pos[i]))g[y*cols+x]=i}return g}
function carMoves(cars,pos,i,g,cols,rows){
  const c=cars[i],p=pos[i],m=axisSize(c,cols,rows)-c.len,out=[];
  const cell=a=>c.h?g[c.y*cols+a]:g[a*cols+c.x];
  for(const d of[-1,1]){let q=p;while(true){const nq=q+d;if(nq<0||nq>m)break;const lead=d<0?nq:nq+c.len-1;if(cell(lead)!==-1)break;q=nq;out.push(q)}}
  return out;
}
// aplica un movimiento y expulsa en cascada a los autos que están en su puerta y les toca
function applyMove(cars,pos,i,p,cols,rows){
  const np=pos.slice();np[i]=p;
  while(true){let nx=-1;for(let k=0;k<np.length;k++)if(np[k]!==-1){nx=k;break}
    if(nx<0)break;if(np[nx]===dockPos(cars[nx],cols,rows))np[nx]=-1;else break}
  return np;
}
function settle(cars,pos,cols,rows){return applyMove(cars,pos,0,pos[0],cols,rows)}
function keyOf(pos){let s='';for(const p of pos)s+=p<0?'~':String.fromCharCode(48+p);return s}
function solve(cars,cols,rows,start,cap){
  const n=cars.length;cap=cap||300000;
  start=settle(cars,start||cars.map(startPos),cols,rows);
  if(start.every(p=>p<0))return{opt:0,path:[],states:1};
  const par=new Map();par.set(keyOf(start),null);
  let layer=[start],steps=0,states=1;
  while(layer.length){
    const next=[];steps++;
    for(const pos of layer){
      const kk=keyOf(pos),g=occupy(cars,pos,cols,rows);
      for(let i=0;i<n;i++){
        if(pos[i]<0)continue;
        for(const q of carMoves(cars,pos,i,g,cols,rows)){
          const np=applyMove(cars,pos,i,q,cols,rows),nk=keyOf(np);
          if(par.has(nk))continue;
          par.set(nk,{prev:kk,i,p:q});states++;
          if(np.every(v=>v<0)){const path=[];let cur=nk;while(par.get(cur)){const e=par.get(cur);path.push({i:e.i,p:e.p});cur=e.prev}path.reverse();return{opt:steps,path,states}}
          if(states>cap)return null;
          next.push(np);
        }
      }
    }
    layer=next;
  }
  return null;
}
</script>

/* 3.1: paisaje alrededor del garaje: pasto, calle, árboles, arbustos, flores y faroles */
let BG=null,BGK='';

function drawScenery(){
  const k=W+'x'+H+'x'+cell+'x'+G.level+'x'+dpr;if(BG&&BGK===k)return BG;BGK=k;
  BG=document.createElement('canvas');BG.width=Math.round(W*dpr);BG.height=Math.round(H*dpr);const c=BG.getContext('2d');c.setTransform(dpr,0,0,dpr,0,0);
  const R=rng(G.level*7919+13),bw=cell*G.cols,bh=cell*G.rows,pad=cell*.2,rw=cell*.32;
  // pasto
  const gg=c.createLinearGradient(0,0,0,H);gg.addColorStop(0,'#3f8a4a');gg.addColorStop(1,'#2c6b3a');c.fillStyle=gg;c.fillRect(0,0,W,H);
  for(let n=0;n<Math.round(W*H/90);n++){const x=R()*W,y=R()*H;c.fillStyle=R()<.5?'rgba(255,255,255,.05)':'rgba(0,40,10,.12)';c.fillRect(x,y,2,3+R()*3)}
  // vereda y calle alrededor del garaje
  const X0=ox-pad-rw,Y0=oy-pad-rw,X1=ox+bw+pad+rw,Y1=oy+bh+pad+rw;
  const box=(x,y,w,h,r,f)=>{c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();c.fillStyle=f;c.fill()};

  c.save();c.strokeStyle='rgba(255,214,90,.75)';c.lineWidth=Math.max(1.5,cell*.03);c.setLineDash([cell*.2,cell*.18]);
  const m=rw*.5;c.beginPath();const ax=X0+m,ay=Y0+m,aw=X1-X0-2*m,ah=Y1-Y0-2*m,ar=cell*.36;c.moveTo(ax+ar,ay);c.arcTo(ax+aw,ay,ax+aw,ay+ah,ar);c.arcTo(ax+aw,ay+ah,ax,ay+ah,ar);c.arcTo(ax,ay+ah,ax,ay,ar);c.arcTo(ax,ay,ax+aw,ay,ar);c.closePath();c.stroke();c.restore();
  // zona libre para decorar: fuera de la calle
  const free=(x,y,r)=>x>-r*.4&&y>-r*.4&&x<W+r*.4&&y<H+r*.4&&(x+r<X0-cell*.1||x-r>X1+cell*.1||y+r<Y0-cell*.1||y-r>Y1+cell*.1);
  const items=[];const tries=Math.round(W*H/(cell*cell)*3);
  for(let n=0;n<tries;n++){const r=cell*(R()<.6?.3+R()*.28:.14+R()*.1),x=R()*W,y=R()*H;if(!free(x,y,r))continue;if(items.some(o=>Math.hypot(o.x-x,o.y-y)<(o.r+r)*.95))continue;items.push({x,y,r,t:r>cell*.26?'tree':(R()<.5?'bush':'flowers')})}
  items.sort((a,b)=>a.y-b.y);
  const greens=['#2f7d3b','#3a9446','#26683a','#4aa356'];
  items.forEach(o=>{
    if(o.t==='tree'){c.fillStyle='rgba(0,0,0,.25)';c.beginPath();c.ellipse(o.x+o.r*.25,o.y+o.r*.3,o.r,o.r*.85,0,0,7);c.fill();
      const g0=greens[Math.floor(R()*greens.length)];for(let q=0;q<5;q++){const a=q/5*6.283+R(),d=o.r*.42;c.fillStyle=shade(g0,-.12);c.beginPath();c.arc(o.x+Math.cos(a)*d,o.y+Math.sin(a)*d,o.r*.55,0,7);c.fill()}
      c.fillStyle=g0;c.beginPath();c.arc(o.x,o.y,o.r*.72,0,7);c.fill();c.fillStyle=shade(g0,.18);c.beginPath();c.arc(o.x-o.r*.22,o.y-o.r*.25,o.r*.36,0,7);c.fill();
      if(R()<.35){c.fillStyle=R()<.5?'#ff6b5a':'#ffd23f';for(let q=0;q<5;q++){c.beginPath();c.arc(o.x+(R()-.5)*o.r*1.2,o.y+(R()-.5)*o.r*1.2,o.r*.07,0,7);c.fill()}}}
    else if(o.t==='bush'){c.fillStyle='rgba(0,0,0,.2)';c.beginPath();c.ellipse(o.x+o.r*.2,o.y+o.r*.25,o.r*1.1,o.r*.8,0,0,7);c.fill();
      [[-.45,0],[.45,0],[0,-.3]].forEach(p=>{c.fillStyle='#2f8a3e';c.beginPath();c.arc(o.x+p[0]*o.r,o.y+p[1]*o.r,o.r*.62,0,7);c.fill()});c.fillStyle='#4fae5c';c.beginPath();c.arc(o.x-o.r*.15,o.y-o.r*.35,o.r*.3,0,7);c.fill()}
    else{const fc=['#ff5fa2','#ffd23f','#ffffff','#8b7bff','#ff9a3d'][Math.floor(R()*5)];for(let q=0;q<6;q++){const x=o.x+(R()-.5)*o.r*2,y=o.y+(R()-.5)*o.r*2;c.fillStyle='#2a6b35';c.beginPath();c.arc(x,y,o.r*.22,0,7);c.fill();c.fillStyle=fc;c.beginPath();c.arc(x,y,o.r*.13,0,7);c.fill()}}
  });
  // faroles en las esquinas de la calle
  [[X0-cell*.07,Y0-cell*.07],[X1+cell*.07,Y0-cell*.07],[X0-cell*.07,Y1+cell*.07],[X1+cell*.07,Y1+cell*.07]].forEach(p=>{
    const lg=c.createRadialGradient(p[0],p[1],0,p[0],p[1],cell*.55);lg.addColorStop(0,'rgba(255,236,160,.35)');lg.addColorStop(1,'rgba(255,236,160,0)');c.fillStyle=lg;c.beginPath();c.arc(p[0],p[1],cell*.55,0,7);c.fill();
    c.fillStyle='#2a2f38';c.beginPath();c.arc(p[0],p[1],cell*.09,0,7);c.fill();c.fillStyle='#ffeaa0';c.beginPath();c.arc(p[0],p[1],cell*.05,0,7);c.fill()});
  return BG}
function drawBoard(now){
  {const bg=drawScenery();ctx.drawImage(bg,0,0,W,H)}
  const bw=cell*G.cols,bh=cell*G.rows,pad=cell*.2,shake=G.shake&&now-G.shake<420?Math.sin((now-G.shake)/30)*cell*.06*(1-(now-G.shake)/420):0;
  ctx.translate(shake,0);
  // muro del garaje
  rr(ox-pad,oy-pad,bw+2*pad,bh+2*pad,cell*.34);const gw=ctx.createLinearGradient(0,oy-pad,0,oy+bh+pad);gw.addColorStop(0,'#8c93a3');gw.addColorStop(1,'#6b7283');ctx.fillStyle=gw;ctx.fill();
  // asfalto
  rr(ox-3,oy-3,bw+6,bh+6,cell*.18);const ga=ctx.createLinearGradient(0,oy,0,oy+bh);ga.addColorStop(0,'#252b37');ga.addColorStop(1,'#1d222c');ctx.fillStyle=ga;ctx.fill();

  ctx.save();ctx.strokeStyle='rgba(255,255,255,.075)';ctx.lineWidth=Math.max(1.5,cell*.035);ctx.setLineDash([cell*.22,cell*.16]);
  for(let x=1;x<G.cols;x++){ctx.beginPath();ctx.moveTo(ox+x*cell,oy+cell*.12);ctx.lineTo(ox+x*cell,oy+bh-cell*.12);ctx.stroke()}
  for(let y=1;y<G.rows;y++){ctx.beginPath();ctx.moveTo(ox+cell*.12,oy+y*cell);ctx.lineTo(ox+bw-cell*.12,oy+y*cell);ctx.stroke()}
  ctx.restore();
  // portones (huecos en el muro con el color de su auto y flecha hacia afuera)
  const vis=i=>G.pos[i]>=0||(now-G.anim[i]<520);const nx=G.pos.findIndex(v=>v>=0);
  G.cars.forEach((c,i)=>{if(!vis(i))return;
    const sh=G.cars.map((d,j)=>j).filter(j=>vis(j)&&G.cars[j].h===c.h&&G.cars[j].ex===c.ex&&(c.h?G.cars[j].y===c.y:G.cars[j].x===c.x));
    const k=sh.length,j=sh.indexOf(i),seg=cell*.66/k,off=cell*.17+j*seg,t=pad-2;
    let x,y,w,h;if(c.h){x=c.ex>0?ox+bw+3:ox-pad;y=oy+c.y*cell+off;w=t;h=seg}else{x=ox+c.x*cell+off;y=c.ex>0?oy+bh+3:oy-pad;w=seg;h=t}
    ctx.save();if(i===nx&&G.state==='play'){ctx.shadowColor=PAL[i%PAL.length];ctx.shadowBlur=cell*(.25+.2*Math.sin(now/220))}
    rr(x,y,w,h,Math.min(w,h)*.35);ctx.fillStyle=PAL[i%PAL.length];ctx.fill();ctx.restore();
    if(k===1)chev(x+w/2,y+h/2,c.ex,c.h,Math.min(w,h)*.32)});

function draw(now){
  ctx.clearRect(0,0,W,H);
  if(VIS.length!==G.pos.length)VIS=G.pos.slice();
  drawBoard(now);
  const a8=Math.min(1,FDT*.018);
  // autos (orden inverso para que el 1 quede encima); posición suavizada hacia la real
  for(let i=G.cars.length-1;i>=0;i--){
    const c=G.cars[i];let a=1,lift=0;
    let p;
    if(G.pos[i]<0){const t=(now-G.anim[i])/520;if(!(t>=0&&t<1)){VIS[i]=-1;continue}const d0=dockPos(c,G.cols,G.rows);p=d0+(c.ex>0?1:-1)*Math.pow(t,1.7)*3.4;a=t<.7?1:1-(t-.7)/.3}
    else if(G.drag&&G.drag.i===i){p=G.drag.f;VIS[i]=p;lift=1}
    else{const tgt=G.pos[i];if(VIS[i]<0||VIS[i]===undefined||Math.abs(VIS[i]-tgt)<.003)VIS[i]=tgt;else VIS[i]+=(tgt-VIS[i])*a8;p=VIS[i]}
    if(G.bump&&G.bump.i===i&&now-G.bump.t<260)p+=Math.sin((now-G.bump.t)/26)*.06*(1-(now-G.bump.t)/260)*G.bump.d;

    if(isNext&&G.state==='play'){rr(q.x+pad,q.y+pad,q.w-2*pad,q.h-2*pad,cell*.3);ctx.lineWidth=2.5+1.5*(.5+.5*Math.sin(now/240));ctx.strokeStyle='rgba(255,255,255,.95)';ctx.stroke()}
    {const bx=q.x+q.w/2,by=q.y+q.h/2,r=cell*.2;ctx.beginPath();ctx.arc(bx,by,r,0,7);ctx.fillStyle='rgba(255,255,255,.94)';ctx.fill();ctx.lineWidth=2;ctx.strokeStyle='rgba(8,14,26,.55)';ctx.stroke();
     ctx.fillStyle='#0b1220';ctx.font='800 '+Math.floor(cell*.28)+'px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(String(i+1),bx,by+1)}
    if(G.sel===i){rr(q.x+1,q.y+1,q.w-2,q.h-2,cell*.26);ctx.lineWidth=3;ctx.strokeStyle='#ffd23f';ctx.stroke()}

    if(G.tutStep===0&&!G.drag){const fr=boardXY(c,G.pos[G.hint.i]),to=q,T=(now%1700)/1700,e=ease(Math.min(1,Math.max(0,(T-.15)/.6)));
      const hx=fr.x+fr.w/2+(to.x-fr.x)*e,hy=fr.y+fr.h/2+(to.y-fr.y)*e,al=T<.85?1:1-(T-.85)/.15;
      ctx.save();ctx.globalAlpha=al;ctx.beginPath();ctx.arc(hx,hy,cell*.26,0,7);ctx.fillStyle='rgba(255,255,255,.28)';ctx.fill();ctx.beginPath();ctx.arc(hx,hy,cell*.15,0,7);ctx.fillStyle='#fff';ctx.fill();
      ctx.beginPath();ctx.arc(hx,hy,cell*.15,0,7);ctx.lineWidth=2;ctx.strokeStyle='rgba(13,19,32,.6)';ctx.stroke();ctx.restore()}}}
  if(G.kb&&G.state==='play'){ctx.save();ctx.strokeStyle='#ffd23f';ctx.lineWidth=2;ctx.setLineDash([4,4]);rr(ox+G.curs.x*cell+4,oy+G.curs.y*cell+4,cell-8,cell-8,cell*.12);ctx.stroke();ctx.restore()}
  // partículas
  if(PARTS.length){const dt=FDT/1000;ctx.save();for(let k=PARTS.length-1;k>=0;k--){const P=PARTS[k];P.vy+=P.g*dt;P.x+=P.vx*dt;P.y+=P.vy*dt;P.vx*=.985;P.life-=P.dec*dt;if(P.life<=0||P.y>H+20){PARTS.splice(k,1);continue}
    ctx.globalAlpha=Math.max(0,Math.min(1,P.life*1.4));ctx.fillStyle=P.col;if(P.sq){P.rot+=dt*6;ctx.save();ctx.translate(P.x,P.y);ctx.rotate(P.rot);ctx.fillRect(-P.r,-P.r*.6,P.r*2,P.r*1.2);ctx.restore()}else{ctx.beginPath();ctx.arc(P.x,P.y,P.r,0,7);ctx.fill()}}ctx.restore()}
}
let lastT=performance.now();
function frame(t){const dt=t-lastT;lastT=t;FDT=Math.min(50,Math.max(1,dt));if(G.state==='play')M.playMs+=dt;try{draw(t)}catch(e){DRAWERR=String((e&&e.name)||'error')+': '+String((e&&e.message)||'').slice(0,80)}requestAnimationFrame(frame)}
/* ---------- entrada ---------- */
function carAtCell(x,y){const g=occupy(G.cars,G.pos,G.cols,G.rows);const i=g[y*G.cols+x];return i}
cv.addEventListener('pointerdown',e=>{
  if(G.state!=='play')return;G.kb=false;
  const r=cv.getBoundingClientRect(),px=e.clientX-r.left,py=e.clientY-r.top;
  const x=Math.floor((px-ox)/cell),y=Math.floor((py-oy)/cell);if(x<0||y<0||x>=G.cols||y>=G.rows)return;
  const i=carAtCell(x,y);if(i<0)return;
  const c=G.cars[i],mv=reachable(i),all=mv.concat([G.pos[i]]);
  G.drag={i,sx:px,sy:py,p0:G.pos[i],lo:Math.min(...all),hi:Math.max(...all),f:G.pos[i],moved:false,id:e.pointerId};
  try{cv.setPointerCapture(e.pointerId)}catch(err){}
});
cv.addEventListener('pointermove',e=>{
  const d=G.drag;if(!d||G.state!=='play')return;
  const r=cv.getBoundingClientRect(),px=e.clientX-r.left,py=e.clientY-r.top;const c=G.cars[d.i];
  const delta=(c.h?px-d.sx:py-d.sy)/cell;if(Math.abs(delta)*cell>6)d.moved=true;
  const raw=d.p0+delta;d.f=Math.max(d.lo,Math.min(d.hi,raw));
  if((raw<d.lo-.18||raw>d.hi+.18)&&!(G.bump&&performance.now()-G.bump.t<350)){G.bump={i:d.i,t:performance.now(),d:raw<d.lo?-1:1};sfx('bump')}
});
function endDrag(e){
  const d=G.drag;if(!d)return;G.drag=null;
  if(G.state!=='play')return;
  if(!d.moved){ // toque: si el camino a la puerta está libre, va directo
    const dp=dockMoveFor(d.i);if(dp!==null&&dp!==G.pos[d.i])commit(d.i,dp);else{G.sel=G.sel===d.i?-1:d.i}
    return;
  }
  let p=Math.round(d.f);p=Math.max(d.lo,Math.min(d.hi,p));
  if(p!==G.pos[d.i])commit(d.i,p);
}
cv.addEventListener('pointerup',endDrag);cv.addEventListener('pointercancel',()=>{G.drag=null});
window.addEventListener('keydown',e=>{
  const k=e.key;
  if(G.state==='menu'&&k==='Escape'&&G.resume){G.resume=false;G.state='play';closeOv();return}
  if(G.state!=='play')return;
  const arrows={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0]};
  if(arrows[k]){
    e.preventDefault();G.kb=true;const[dx,dy]=arrows[k];
    if(G.sel>=0&&G.pos[G.sel]>=0){
      const c=G.cars[G.sel];
      if(c.h&&dx!==0||!c.h&&dy!==0){const d=c.h?dx:dy,np=G.pos[G.sel]+d,mv=reachable(G.sel);
        if(mv.includes(np)){const same=G.last&&G.last.i===G.sel&&G.last.dir===d;commit(G.sel,np,same)}else toast('Bloqueado')}
      return;
    }

  }else if(k==='Enter'||k===' '){
    if(document.activeElement&&document.activeElement.tagName==='BUTTON')return;e.preventDefault();G.kb=true;
    if(G.sel>=0&&k===' '){const dp=dockMoveFor(G.sel);if(dp!==null)commit(G.sel,dp);else toast('El camino a la puerta no está libre');return}
    const i=carAtCell(G.curs.x,G.curs.y);G.sel=(i>=0&&i!==G.sel)?i:-1;
  }else if(k==='Escape'){if(G.sel>=0)G.sel=-1;else menuScreen()}
  else if(k==='z'||k==='Z')undo();else if(k==='h'||k==='H')useHint();else if(k==='r'||k==='R')startLevel(G.level,true);
});
$('bMenu').onclick=()=>{if(G.state==='play'||G.state==='menu')menuScreen()};
$('savest').onclick=()=>toast(saveInfo());$('bUndo').onclick=undo;$('bHint').onclick=useHint;$('bMoves').onclick=()=>{if(G.state==='play')ask('+3 movimientos',15,'extra_moves',()=>{G.limit+=3;M.extraMoves=(M.extraMoves||0)+3;hud();save();toast('+3 movimientos')})};$('bRestart').onclick=()=>{if(G.state==='play')startLevel(G.level,true)};
window.addEventListener('resize',resize);try{new ResizeObserver(()=>resize()).observe($('board'))}catch(e){}
/* ---------- ganchos de prueba ---------- */
window.__g2={
  levels:()=>BASE,gen:()=>S.gen||{},genStats:()=>({ok:M.genOk||0,fail:M.genFail||0,err:M.genErr||0}),lang:()=>LANGv,

  cars:()=>G.cars.map((c,i)=>({i,x:c.x,y:c.y,len:c.len,h:c.h,ex:c.ex,p:G.pos[i]})),
  geom:()=>({ox,oy,cell}),
  start:l=>startLevel(l),
  path:()=>{const s=solve(G.cars,G.cols,G.rows,G.pos,300000);return s?s.path:null},
  verifyAll:()=>LEVELS.map((L,k)=>{const cs=L.cars;const s=solve(cs,L.cols,L.rows,null,400000);return{k:k+1,n:cs.length,opt:L.opt,solved:s?s.opt:null}}),

};
resize();startLevel(entry());M.started--;G.state='menu';G.resume=false;BOOT=false;
const FIRST=LOCAL_OK&&!S.tut&&(S.max||1)<=1&&!S.cur&&MODE==='all'&&!(S.stars&&Object.keys(S.stars).length);
if(FIRST)startLevel(1);else menuScreen();requestAnimationFrame(frame);cloudInit();
})();
